name: CI

# The five required checks, and nothing else. Everything slow, network-bound or
# flaky-by-construction lives in nightly.yml.
#
# DO NOT RENAME any `name:` below. Each one is matched as a literal string by
# branch protection. A renamed job reports under its new name, the required
# context stays "Expected" forever, and every open PR becomes unmergeable until
# protection is edited to match. Widening what a job covers is free; renaming it
# is not.
#
# There is deliberately NO `on.paths` and NO paths-filter job. A workflow skipped
# by `on.paths` creates no check run at all, so a required context stays
# "Expected" and the PR can never merge; the old file spent about 200 lines and a
# whole job working around that. In a Rust monorepo where nearly every PR touches
# crates/, the filter bought little and cost the entire footgun. The trade is
# stated plainly: a README-only PR pays the full run.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded pushes used to run to completion: four pushes to one branch in half
# an hour queued four full runs. Group per ref and cancel only on pull_request,
# because a push to main must still get its own complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Everything cheap enough to be worth failing fast on: formatting, the
  # workflow files themselves, the hook scripts, and the two committed-artifact
  # sanity checks. Folding the old standalone actionlint workflow in here saves
  # a workflow file and a checkout.
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-21
        with:
          components: rustfmt
          # The phone targets `ainb-hangar-noise` must keep compiling for (R1).
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Test and Contracts both refuse to save (see their comments), so this
          # job and `generated` are the cache writers. Saving only from main also
          # means a fork PR can restore a cache but never write one.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      # The peer wire is shared with the phone crate, which cannot be rebuilt
      # from here, so a dependency that stops compiling for a phone target has
      # to fail this job, not a mobile build weeks later. `check` needs no
      # linker, so the ubuntu runner covers the Apple targets too.
      - name: The peer wire compiles for the five phone targets
        run: |
          for target in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios \
                        aarch64-linux-android x86_64-linux-android; do
            cargo check -p ainb-hangar-noise --target "$target"
          done
      # An abandoned debugging probe reverts real behaviour while every doc
      # comment, test and help string around it still asserts the fix. Cheap
      # grep, runs in the fastest job.
      - name: No leftover debugging probes
        run: bash scripts/check-no-probes.sh
      # Asserts the hangar-e2e contract in nightly.yml: both runners in its
      # matrix, and tmux installed before the tripwire script. See
      # xtask/src/ci_lint.rs.
      - name: Assert the nightly hangar-e2e contract
        run: cargo xtask ci-lint
      # Guards the failure mode that let toolkit-validation.yml sit broken for
      # six weeks: an unparseable workflow file produces a run with ZERO jobs,
      # which GitHub reports as neither red nor amber.
      #
      # shellcheck is intentionally disabled (-shellcheck=): it flags
      # pre-existing style and quoting nits in unrelated `run:` blocks that would
      # fail any PR touching workflow files for reasons unrelated to workflow
      # validity. Everything actionlint checks on top of shellcheck (YAML syntax,
      # expression syntax, job and step schema, action input validation,
      # reachability) stays on, which is what catches the original defect.
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
        shell: bash
      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color -shellcheck=
        shell: bash
      - name: Hook script parses
        run: bash -n plugins/ainb-hooks/hooks/notify.sh
      - name: Stall guard compiles and its self-check passes
        run: |
          python3 -m py_compile plugins/ainb-hooks/hooks/stall_guard.py
          python3 plugins/ainb-hooks/hooks/stall_guard.py --self-test
      # Nine zero-byte GIFs reached main because a recorder failed silently and
      # nothing checked that a committed artifact carries bytes. A file existing
      # is not evidence.
      - name: Every committed recording carries bytes
        run: |
          empty="$(find crates/ainb-core/tests/recordings -type f -empty -print)"
          if [ -n "$empty" ]; then
            echo "::error::empty recording artifacts committed:"; echo "$empty"; exit 1
          fi
          echo "all recordings non-empty"

  # ──────────────────────────────────────────────────────────────────────────
  # Generated artifacts freshness. man/cli.md, man/keyboard-shortcuts.md and
  # man/ainb.1 are all generated from the real `ainb` binary, and
  # crates/ainb-app/bindings/AppState.ts is generated from the mirror frame's
  # Rust types by specta. All four are committed, and this job fails if any of
  # them drifts, so the code stays the single source of truth.
  #
  # One job for all four: the cargo build is paid for once.
  # ──────────────────────────────────────────────────────────────────────────
  generated:
    name: Generated artifacts freshness
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-21
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build ainb
        run: cargo build -p ainb
      - name: Regenerate the CLI reference from the binary
        run: AINB_BIN=target/debug/ainb bash scripts/gen-cli-reference.sh
      - name: Assert man/cli.md is up to date
        run: |
          # Tracked-ness FIRST: `git diff` ignores untracked files, so an
          # uncommitted generated page would make the diff a silent no-op and
          # this job would go green having shipped nothing.
          if ! git ls-files --error-unmatch man/cli.md > /dev/null 2>&1; then
            echo "::error::man/cli.md is not tracked by git: generate it and commit the result." >&2
            exit 1
          fi
          if ! git diff --exit-code -- man/cli.md; then
            echo "::error::man/cli.md is stale: run scripts/gen-cli-reference.sh and commit the result." >&2
            exit 1
          fi
      - name: Regenerate keyboard shortcuts from the keymap
        run: AINB_BIN=target/debug/ainb bash scripts/gen-keymap-docs.sh
      - name: Assert man/keyboard-shortcuts.md is up to date
        run: |
          if ! git ls-files --error-unmatch man/keyboard-shortcuts.md > /dev/null 2>&1; then
            echo "::error::man/keyboard-shortcuts.md is not tracked by git: generate it and commit the result." >&2
            exit 1
          fi
          if ! git diff --exit-code -- man/keyboard-shortcuts.md; then
            echo "::error::man/keyboard-shortcuts.md is stale: run scripts/gen-keymap-docs.sh and commit the result." >&2
            exit 1
          fi
      - name: Regenerate the man page from the binary
        run: AINB_BIN=target/debug/ainb bash scripts/gen-man.sh
      - name: Assert man/ainb.1 is up to date
        run: |
          # Same tracked-ness assertion: without it a man page that was never
          # committed passes the freshness gate, and the release tarball ships
          # no man page at all.
          if ! git ls-files --error-unmatch man/ainb.1 > /dev/null 2>&1; then
            echo "::error::man/ainb.1 is not tracked by git: generate it with scripts/gen-man.sh and commit the result." >&2
            exit 1
          fi
          if ! git diff --exit-code -- man/ainb.1; then
            echo "::error::man/ainb.1 is stale: run scripts/gen-man.sh and commit the result. Authored prose belongs in the script's heredoc, not in the page." >&2
            exit 1
          fi
      # WRITE_BINDINGS_SAMPLE is load-bearing, not decoration: sample.check.ts is
      # gitignored and written by this test, and `npm run check` below type-checks
      # it against AppState.ts. Without it the npm step fails on a missing file.
      - name: Regenerate AppState.ts and write the sample frames
        run: |
          UPDATE_APP_STATE_TS=1 WRITE_BINDINGS_SAMPLE="$PWD/crates/ainb-app/bindings/sample.check.ts" \
            cargo test -p ainb-app --features typescript-bindings --test bindings
      - name: Assert crates/ainb-app/bindings/AppState.ts is up to date
        run: |
          if ! git ls-files --error-unmatch crates/ainb-app/bindings/AppState.ts > /dev/null 2>&1; then
            echo "::error::AppState.ts is not tracked by git: generate it and commit the result." >&2
            exit 1
          fi
          if ! git diff --exit-code -- crates/ainb-app/bindings/AppState.ts; then
            echo "::error::AppState.ts is stale: run UPDATE_APP_STATE_TS=1 cargo test -p ainb-app --features typescript-bindings --test bindings and commit the result." >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: crates/ainb-app/bindings/package-lock.json
      - name: Type-check the sample frames against AppState.ts
        run: npm ci --no-audit --no-fund && npm run check
        working-directory: crates/ainb-app/bindings

  # ──────────────────────────────────────────────────────────────────────────
  # Contracts: deterministic golden and mutation gates, in their own job.
  #
  # Why not just trust `Test` to carry them: in the general pool a contract
  # failure is one line among thousands and reads as noise. That is exactly how a
  # real BdLock two-holder race got mistaken for a flake for days. These tests
  # compare deterministic renderings to committed golden and lock files, so they
  # cannot legitimately flake.
  #
  # POLICY: a red job here is NEVER rerun to green. Fix the code or delete the
  # contract; do not re-run the workflow.
  #
  # The overlap with `Test --workspace` is deliberate and kept. This job exists
  # for the SIGNAL. Running the same binary twice costs seconds; a filter typo
  # silently dropping coverage is the failure class these contracts exist to
  # prevent.
  # ──────────────────────────────────────────────────────────────────────────
  contracts:
    name: Contracts
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `--all-features` across the workspace, plus the nested `cargo build` that
      # `real_plugin_axes` runs per in-tree plugin, outgrew what a stock runner
      # leaves free. It surfaced as `failed to build archive: No space left on
      # device` while linking, which the harness could only report as `exit
      # status: 101`, so it read as a broken contract. The preinstalled Android,
      # .NET and GHC toolchains are tens of GB and nothing here uses them.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-21
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Archiving this job's target tree exhausts runner disk during
          # rust-cache's post-job metadata pass. Registry restore is still
          # useful; only saving invokes the failing pass.
          cache-targets: false
          save-if: false
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: nextest
      # Each binary compares live code to a COMMITTED file:
      #   argv_golden_matrix           frozen per-provider CLI invocation shape
      #   migration_upgrade_full_chain forward-chain replay over a seeded db
      #   ainb-plugin-cts-v2           14-axis protocol conformance plus the
      #                                wire-surface semver gate
      #   skew_harness                 the {daemon N, N-1} x {client, web, Swift}
      #                                matrix, both directions, plus the local leg
      #   capability_catalogue         the removal-fails gate over the catalogue
      #   mutation_dedupe              the walk over the committed MUTATING_METHODS
      #   wire_contract                the peer wire v1 golden bytes (header,
      #                                prologue, offer URI, opcode registry)
      #   scope_catalogue              every method classified per scope, no
      #                                default, diffed against scopes.catalogue
      #   v2_contract_dark             the v2-next methods and capabilities stay
      #                                dark until each phase flips them
      #
      # `--workspace` is required: this repo's default-members covers only
      # ainb-core and ainb-hangar-daemon, and several of these live outside it.
      - run: >
          cargo nextest run --workspace --all-features --no-fail-fast
          -E 'binary(argv_golden_matrix) + binary(migration_upgrade_full_chain) + package(ainb-plugin-cts-v2)
              + binary(skew_harness) + binary(capability_catalogue) + binary(mutation_dedupe)
              + binary(wire_contract) + binary(scope_catalogue) + binary(v2_contract_dark)'

  # ──────────────────────────────────────────────────────────────────────────
  # The workspace test suite on Linux. The macOS leg is nightly: its measured
  # p95 was 28.7 minutes and macOS bills at 10x, which made it roughly 290 billed
  # minutes per PR on its own.
  # ──────────────────────────────────────────────────────────────────────────
  test-linux:
    name: Test (ubuntu-latest)
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # MEASURED, run 32785104108: this job's target tree peaks at 85G and the
      # runner offers 86G free after the image. A ~1G margin, which is why it
      # failed roughly one run in three rather than every time, and why it always
      # died on ainb-plugin-abtop: that is the LAST of the six nested plugin
      # builds `real_plugin_axes` runs, so it links at peak accumulation.
      #
      # It does NOT present as a disk error. rust-lld sizes the output with
      # ftruncate, mmaps it, and only faults when a page is written to a
      # filesystem that can no longer allocate blocks, so ENOSPC arrives as
      # `ld terminated with signal 7 [Bus error]` under an LLVM crash report.
      # That cost two days of being read first as a flake, then as infra.
      #
      # This reclaim frees about 20G, taking the margin from ~1G to ~21G.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/boost
          df -h /
      # Fail FAST and legibly if the headroom ever goes away again, rather than
      # 20 minutes later as a linker crash nobody can attribute.
      - name: Assert disk headroom for the --all-features build
        run: |
          avail=$(df --output=avail / | tail -1)
          need=94371840   # 90G in 1K blocks; the tree measured 85G
          if [ "$avail" -lt "$need" ]; then
            echo "::error::only $((avail/1048576))G free, this job's build needs ~85G. Reclaim more before it links, because rust-lld reports exhaustion as SIGBUS, not as a disk error."
            exit 1
          fi
          echo "$((avail/1048576))G free, need ~85G"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-21
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Observed three consecutive runs where `cargo nextest` SUCCEEDED and
          # the job was then failed by `Post Run Swatinem/rust-cache` with "No
          # space left on device". A green test run must not be reported as a
          # failure by the step that saves a cache for next time.
          cache-targets: false
          save-if: false
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: nextest
      # `--lib` alone builds ONLY in-source `#[cfg(test)]` modules, so every
      # integration target under crates/*/tests/ was invisible: whole test files
      # could be added, or stop compiling, without any job noticing. `--tests`
      # includes them.
      #
      # `--workspace` is load-bearing for the same class of reason. Without it
      # nextest honours default-members (ainb-core and ainb-hangar-daemon), so
      # this job tested 2 of 35 crates and silently skipped the rest, including
      # the whole database layer.
      #
      # The tripwire_* binaries are excluded: they drive a real `ainb tui` under
      # tmux against staged plugins, which this job deliberately does not
      # provision. Running them here fails on the missing harness, not on the
      # code. nightly.yml runs every one of them.
      - run: "cargo nextest run --workspace --lib --tests --all-features --no-fail-fast -E 'not binary(/^tripwire_/)'"

  # ──────────────────────────────────────────────────────────────────────────
  # The one macOS job on the merge path. `cargo check --all-targets` catches the
  # failure mode that actually recurs, macOS-only compile breakage, in about a
  # third of the time the full test leg took. macOS-only RUNTIME regressions are
  # caught by nightly's `Test (macos-latest)`.
  # ──────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build (macos-latest)
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-21
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-features --all-targets
