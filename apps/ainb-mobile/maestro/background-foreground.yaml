# M1-09 / M1-14 step 4: a real background (Home), then foreground, on the
# same process: the banner already shown is not shown again and the host's
# sessions are still there. The real run (M1-14) commits 20 fleet events plus
# 1 ASK through the scenario script during the WAIT below and then asserts the
# new banner once; pass NEW_ATTENTION_ID to enable that assertion.
#   HOST_ID, SESSION_NAME, ATTENTION_ID, QUESTION: see banner-answer.yaml
appId: com.stevengonsalvez.ainb.mobile
env:
  NEW_ATTENTION_ID: ""
  WAIT_MS: "3000"
---
- launchApp:
    clearState: true
- assertVisible:
    text: ${QUESTION}
- tapOn:
    id: "banner-${ATTENTION_ID}"
- tapOn:
    id: "answer-cancel"
- tapOn:
    id: "host-${HOST_ID}"
- assertVisible:
    text: ${SESSION_NAME}
# background: Home, not a kill
- pressKey: Home
- waitForAnimationToEnd:
    timeout: ${WAIT_MS}
# foreground: same process, no clearState
- launchApp:
    stopApp: false
- assertVisible:
    text: ${SESSION_NAME}
- assertVisible:
    id: "banner-${ATTENTION_ID}"
- runFlow:
    when:
      true: ${NEW_ATTENTION_ID != ""}
    commands:
      - assertVisible:
          id: "banner-${NEW_ATTENTION_ID}"
