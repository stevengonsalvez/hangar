# M1-11: the terminal renders the recorded fixture at phone size.
# The FakeWire stream snapshots f1-altscreen on attach; the screenshot is the
# artifact the compare reads (framed panel, log lines, status row).
#   HOST_ID, SESSION_KEY: see README.md
appId: com.stevengonsalvez.ainb.mobile
---
- launchApp:
    clearState: true
- tapOn:
    id: "host-${HOST_ID}"
- tapOn:
    id: "session-${SESSION_KEY}"
- tapOn:
    id: "tab-terminal"
- assertVisible:
    id: "terminal"
- assertVisible:
    id: "terminal-size"
# painted, not merely up, and exactly the fixture: 2284 bytes of f1-altscreen
# plus the 68-byte OSC 8 line the fake appends, counted by xterm itself
- assertVisible:
    text: "engine ready, 2352 B.*"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: terminal-f1-altscreen
