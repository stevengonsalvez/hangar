# M1-09 / M1-14: the two-tap banner answer.
#
# Parameters come from the caller, never from the flow:
#   OFFER        pairing offer URI; empty means the app is already paired
#   ATTENTION_ID the open attention row's id (the scenario script knows it)
#   QUESTION     its question text, asserted on the banner and the sheet
#   OPTION       1-based option to answer with
# FakeWire build values are in README.md; the real run (M1-14) gets them from
# scripts/proof/scenarios/m1-phone-answer.sh.
appId: com.stevengonsalvez.ainb.mobile
env:
  OFFER: ""
  OPTION: "2"
---
- launchApp:
    clearState: true
- runFlow:
    when:
      true: ${OFFER != ""}
    commands:
      - tapOn:
          id: "pair"
      - tapOn:
          id: "offer"
      - inputText: ${OFFER}
      - assertVisible:
          id: "offer-preview"
      - tapOn:
          id: "pair-submit"
      - assertVisible:
          text: "reachable"
- assertVisible:
    text: ${QUESTION}
# tap 1: the banner
- tapOn:
    id: "banner-${ATTENTION_ID}"
- assertVisible:
    id: "answer-sheet"
# tap 2: the option
- tapOn:
    id: "option-${OPTION}"
- assertVisible:
    text: "Delivered"
- tapOn:
    id: "answer-done"
- assertNotVisible:
    id: "banner-${ATTENTION_ID}"
