[package]
name = "ainb-hangar-client"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The ONE client onto the hangar daemon's unix socket: auth/hello, Content-Length JSON-RPC, and the retained fleet / message / transcript subscriptions. Extracted from ainb-core so the TUI, the CLI and Pal's MCP tool server all dial the daemon through the same code (ainb-core depends on ainb-hangar-daemon, so nothing below it can depend back on ainb-core)."
categories = ["command-line-utilities"]
keywords = ["ainb", "hangar", "json-rpc", "client", "fleet"]

[lib]
name = "ainb_hangar_client"
path = "src/lib.rs"

[features]
default = []
test-support = []

[dependencies]
# The wire shapes. Pure data crate, so the client adds no vocabulary of its own.
ainb-hangar-proto = { path = "../ainb-hangar-proto" }
# Hangar home resolution (`hangar_home`) for the socket + token file paths.
ainb-hangar-core = { path = "../ainb-hangar-core" }
tokio = { workspace = true }
# `Serialize`/`DeserializeOwned` bound `call_typed`, so a caller has to name the
# proto types rather than hand-build JSON for an arbitrary method.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Logs a hello whose host id is malformed or changed under one socket (#1066).
tracing = { workspace = true }
# The peer wire (R1-09): the pairing offer's `Endpoint`, and later the Noise
# session. Pure Rust, no IO.
ainb-hangar-noise = { path = "../ainb-hangar-noise" }
# Pairing secrets (the device's static key and token) in the OS keychain.
ainb-hangar-secrets = { path = "../ainb-hangar-secrets" }
# The `peers.json` key encoding, the same base64url as the pairing offer.
base64 = "0.22"

[dev-dependencies]
# The fake-socket tests bind a `UnixListener` in a temporary directory.
tempfile = { workspace = true }
# The in-memory keychain double, so pairing tests never touch the real one.
ainb-hangar-secrets = { path = "../ainb-hangar-secrets", features = ["test-backend"] }

[lints]
workspace = true
