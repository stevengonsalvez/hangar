[package]
name = "ainb-desktop"
# One version per release: the release workflow's prepare job bumps this line
# with the parent workspace's, and the bundler reads it (tauri.conf.json
# carries no version of its own).
version = "1.28.2"
edition = "2021"
publish = false
description = "ainb desktop shell: a Tauri v2 host of the ainb-app state machine"
license = "MIT"

# Its own workspace, excluded from the parent's `members`: the parent's
# `--all-features` Test job never builds Tauri or needs webkit2gtk.
[workspace]

[lib]
name = "ainb_desktop"
path = "src/lib.rs"

# The window needs Tauri and the platform webview; the host, the executor and
# the sidecar supervisor do not, so their tests build without either.
[[bin]]
name = "ainb-desktop"
path = "src/main.rs"
required-features = ["app"]

[features]
default = []
app = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:ainb-hangar-core", "dep:tracing-subscriber"]
# The window serves `ui/dist` over its own protocol instead of the dev server
# at `build.devUrl`. A plain `cargo build` keeps the dev server, which is what
# `tauri dev` and the frontend's hot reload want; every build that has to run
# on its own (the journey, the bundle, the proof scenario) takes this.
bundled = ["app", "tauri/custom-protocol"]
# The embedded WebDriver the wdio journey drives, off in every normal build and
# in every bundle: the CI bundle smoke asserts the release binary carries no
# WebDriver symbol and binds no driver port. The journey drives a window
# serving its own frontend, so this implies `bundled`.
wdio = ["bundled", "dep:tauri-plugin-wdio-webdriver"]
# Derives `specta::Type` on the shapes that cross the IPC seam (the proto's
# `SpawnAgent` included) and exposes `bindings`, which renders `Desktop.ts`. Off in every normal build; the CI
# desktop workflow builds with it and diffs the output.
typescript-bindings = ["dep:specta", "dep:specta-serde", "dep:specta-typescript", "ainb-hangar-proto/typescript-bindings"]
# The updater's test seams (`Updater::with_key`, the `Verify::Key` arm). On
# only through this crate's own dev-dependency below, so `cargo test` has
# them and no bundle or `cargo build` does; a release build that carries the
# feature is refused by the guard at the bottom of `updater.rs`.
test-seams = []

[dependencies]
ainb-app = { path = "../ainb-app" }
ainb-hangar-client = { path = "../ainb-hangar-client" }
ainb-hangar-core = { path = "../ainb-hangar-core", optional = true }
ainb-hangar-proto = { path = "../ainb-hangar-proto" }
# `spawn::registered_roots`, the daemon's own definition of the folders it
# creates from, so the composer's project list cannot drift from it. Already
# in the build through `ainb-app`.
ainb-hangar-daemon = { path = "../ainb-hangar-daemon" }
anyhow = "1"
arboard = "3.6"
nix = { version = "0.29", features = ["fs", "process", "signal"] }
# The OS notification a session's move into Needs or Done raises, sent by the
# host (`notify_delivery.rs`). Straight to the platform rather than through
# tauri-plugin-notification, which drops the handle a click arrives on. Needs
# no Tauri, so the headless tests drive it too.
notify-rust = "4.18"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The updater hashes the downloaded bundle file against the signed manifest,
# and mounts a disk image on a temporary mount point.
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1.36", features = ["full"] }
# Reads and appends the daemon's projects file (`projects.rs`, Add project).
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true, features = ["fmt"] }
uuid = { version = "1.5", features = ["serde", "v4"] }
# Parses the URL a terminal link click asks the host to open (`links.rs`).
# Already in the build through tauri.
url = "2"
tauri = { version = "~2.11.5", optional = true }
# The native confirmation in front of the onboarding writes (#1175): a message
# dialog the OS draws, which the webview's script cannot click. Rust side only;
# the webview never calls the plugin, so it needs no capability.
tauri-plugin-dialog = { version = "2.7", optional = true }
# Opens a terminal link in the default browser (`open_url`), after
# `links::web_url` has passed it. Called as a library, never registered as a
# plugin, so the webview has none of its commands and needs no capability.
# `~2.5`: 2.6 wants tauri 2.12, past this crate's pin.
tauri-plugin-opener = { version = "~2.5", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.4", optional = true }
# Pinned to the same releases `ainb-app` renders its frame contract with, so
# both files are produced by one version of specta.
specta = { version = "=2.0.0-rc.25", features = ["derive", "uuid", "chrono", "serde_json"], optional = true }
specta-serde = { version = "=0.0.12", optional = true }
specta-typescript = { version = "=0.0.12", optional = true }

# The shared click listener (`notify_delivery/linux.rs`) dials its own
# session-bus connection to hear `ActionInvoked`/`NotificationClosed`
# directly; `notify-rust`'s own per-send connection only covers the `Notify`
# call itself, not hearing the click later. Same major version and feature
# set `notify-rust` itself asks for on this target, so it is one zbus build
# in the binary, not two.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[build-dependencies]
tauri-build = { version = "~2.6.3", optional = true }

[dev-dependencies]
# This crate, with its own test seams on, for its integration tests only.
ainb-desktop = { path = ".", features = ["test-seams"] }
# The shared agent status reader's fake daemon (#1188).
ainb-app = { path = "../ainb-app", features = ["test-support"] }
# The updater tests sign a manifest with a throwaway key.
base64 = "0.22"
ed25519-dalek = "2.1"

# The notification click test serves a fake notification daemon on a private
# session bus (`tests/notify_click_dbus.rs`), and captures its tracing output
# to prove the waiter-cap warning and the shared listener's behaviour.
# `zbus` itself is a normal (non-dev) dependency on this target now, see above.
[target.'cfg(target_os = "linux")'.dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["registry"] }
