[package]
name = "ainb-term"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Headless terminal emulation for the Hangar daemon's terminal stream (R2). Pure: no daemon, tmux or IO dependencies."

# Not a default member and not a dependency of any shipped crate yet, so
# release builds (`cargo build --release`, default-members only) never link it.
# CI still builds and tests it through `--workspace --all-features`.

[lib]
name = "ainb_term"
path = "src/lib.rs"

[dependencies]
wezterm-term = { workspace = true }
# The parser the emulator itself uses, pinned to the exact version the fork
# depends on (see Cargo.lock), so the mode tracker and the grid see the same
# actions. Already in the lock file through wezterm-term: no new lock entry.
wezterm-escape-parser = { package = "tattoy-wezterm-escape-parser", version = "=0.1.0-1" }

[dev-dependencies]
proptest = { workspace = true }
