# uniffi-bindgen-react-native (ubrn) configuration for the phone bridge.
#
# The Expo app's native module points its ubrn at this file, so the crate
# owns how it is built for each phone target and the app owns nothing about
# Rust. Paths are relative to this crate.
#
# `useSharedLibrary: false` links the Rust staticlib into the module's own
# JSI library; the app's link step adds `-Wl,--exclude-libs,libainb_wire_mobile.a
# -Wl,--gc-sections` so only the uniffi symbols survive. The size gate in
# `.github/workflows/mobile.yml` measures the release cdylib per ABI as the
# proxy for that.
rust:
  directory: .
  manifestPath: Cargo.toml
android:
  targets:
    - arm64-v8a
    - x86_64
  apiLevel: 24
  useSharedLibrary: false
ios:
  targets:
    - aarch64-apple-ios
    - aarch64-apple-ios-sim
